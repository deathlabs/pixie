requirements:
  - vulnerability_id: V-900001
    source_requirement: SRG-APP-000033
    requirement_id: AAI-000010
    rule_id: SV-900001r1_rule
    severity: medium
    title: The AI agent must only invoke explicitly authorized tools and operations.
    discussion: >
      AI agents may invoke tools, services, application programming interfaces,
      or other system capabilities while performing assigned tasks. Granting an
      AI agent access to tools or operations that are not required for its
      assigned functions increases the potential for unauthorized access,
      privilege misuse, or unintended system modification. Tool access must be
      explicitly authorized and restricted according to the principle of least
      privilege.
    false_positives: ""
    false_negatives: ""
    documentable: false
    mitigations: ""
    severity_override_guidance: ""
    potential_impacts: ""
    third_party_tools: ""
    mitigation_control: ""
    responsibility: ""
    ia_controls: ""
    ccis:
      - CCI-000213
    fix_id: F-900001r1_fix
    fix: >
      Configure the AI agent to use an explicit allowlist of authorized tools
      and operations. Remove tools and operations that are not required for the
      agent's assigned functions and enforce authorization outside of the AI
      model.
    check_id: C-900001r1_chk
    check: |
      Review the AI agent configuration, tool registry, and authorization policy.

      Verify that each tool available to the AI agent is explicitly authorized.

      Verify that the operations available through each tool are limited to those
      required for the agent's assigned functions.

      Attempt to invoke an unauthorized tool or operation through the AI agent.

      If the AI agent can invoke a tool or operation that has not been explicitly
      authorized, this is a finding.
  - vulnerability_id: V-900002
    source_requirement: SRG-APP-000340
    requirement_id: AAI-000020
    rule_id: SV-900002r1_rule
    severity: high
    title: The AI agent must restrict access to privileged tool functions.
    discussion: >
      AI agents may interact with tools that provide both non-privileged and
      privileged functions. Privileged functions may modify system state,
      execute administrative actions, alter security configurations, delete
      information, or access sensitive resources. Allowing an AI agent to invoke
      privileged functions without appropriate authorization increases the risk
      that manipulated, erroneous, or unintended agent behavior will result in
      unauthorized system actions.

    false_positives: ""
    false_negatives: ""
    documentable: false
    mitigations: ""
    severity_override_guidance: ""
    potential_impacts: ""
    third_party_tools: ""
    mitigation_control: ""
    responsibility: ""
    ia_controls: ""
    ccis:
      - CCI-002235
    fix_id: F-900002r1_fix
    fix: >
      Configure the AI agent and associated tools to restrict privileged
      functions to explicitly authorized identities and agent workflows.
      Separate privileged operations from non-privileged operations and require
      additional authorization for privileged actions.
    check_id: C-900002r1_chk
    check: |
      Review the AI agent's available tools and identify tools that provide
      privileged functions.

      Review the authorization policy associated with each privileged function.

      Verify that privileged functions are not available to the AI agent unless
      explicitly required and authorized.

      Attempt to direct the AI agent to perform a privileged operation for which
      it has not been authorized.

      If the AI agent can perform an unauthorized privileged function, this is a
      finding.
  - vulnerability_id: V-900003
    source_requirement: SRG-APP-000095
    requirement_id: AAI-000030
    rule_id: SV-900003r1_rule
    severity: medium
    title: The AI agent must generate audit records for tool invocations.
    discussion: >
      AI agents may initiate actions against external systems through tools,
      application programming interfaces, services, or other agents. Without
      sufficient audit information, actions performed by an AI agent cannot be
      reliably attributed to the originating user, agent, tool, or authorization
      decision. Audit records are necessary to support accountability, incident
      investigation, detection of unauthorized actions, and reconstruction of
      agent activity.
    false_positives: ""
    false_negatives: ""
    documentable: false
    mitigations: ""
    severity_override_guidance: ""
    potential_impacts: ""
    third_party_tools: ""
    mitigation_control: ""
    responsibility: ""
    ia_controls: ""
    ccis:
      - CCI-000130
    fix_id: F-900003r1_fix
    fix: >
      Configure the AI agent runtime or tool execution layer to generate audit
      records for tool invocations. Audit records must include sufficient
      information to identify the originating user or process, the AI agent, the
      tool invoked, the requested operation, the authorization decision, the
      time of the action, and the result of the invocation.
    check_id: C-900003r1_chk
    check: |
      Invoke an authorized tool through the AI agent.

      Review the resulting audit records.

      Verify the audit record identifies, at a minimum:
      - The originating user or process.
      - The AI agent.
      - The tool invoked.
      - The requested operation.
      - The authorization decision.
      - The date and time of the invocation.
      - The result of the invocation.

      If tool invocations are not audited or the audit records do not contain
      sufficient information to reconstruct the agent action, this is a finding.
